<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIAREQUOCTE - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0b10; color: #ffffff; padding-bottom: 70px; }
        
        /* Header */
        .header { padding: 15px; background: #12121a; border-bottom: 1px solid #1f1f2e; }
        .admin-card { display: flex; align-items: center; background: #1a1a24; padding: 12px; border-radius: 12px; border: 1px solid #2a2a3a; }
        .admin-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #00d2ff; background: #fff; }
        .admin-info { margin-left: 12px; flex-grow: 1; }
        .admin-name { font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .badge-admin { background: #423000; color: #ffcc00; font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid #ffcc00; }
        .admin-id { color: #ff4d8d; font-size: 12px; margin-top: 4px; background: #2a0d18; padding: 4px 8px; border-radius: 6px; display: inline-block; }
        
        /* Main Content */
        .content { padding: 15px; }
        .page-title { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .page-subtitle { color: #888; font-size: 13px; margin-bottom: 15px; }
        
        /* Search Bar */
        .search-box { width: 100%; padding: 12px 15px; border-radius: 10px; background: #1a1a24; border: 1px solid #2a2a3a; color: white; font-size: 14px; margin-bottom: 15px; outline: none; }
        .search-box:focus { border-color: #00d2ff; }

        /* Product Grid */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .product-card { background: #1a1a24; border-radius: 12px; padding: 10px; border: 1px solid #2a2a3a; display: flex; flex-direction: column; justify-content: space-between; }
        .product-img { width: 100%; height: 90px; object-fit: contain; background: #0b0b10; border-radius: 8px; margin-bottom: 10px; padding: 5px; }
        .product-name { font-size: 13px; font-weight: bold; line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 36px; }
        .product-price { color: #00d2ff; font-weight: bold; font-size: 15px; margin-bottom: 8px; }
        .product-stock { font-size: 11px; color: #888; margin-bottom: 8px; }
        .btn-buy { width: 100%; background: linear-gradient(90deg, #ff4d8d, #ff2a6d); color: white; border: none; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
        
        /* States */
        .loading-text { text-align: center; color: #888; grid-column: span 2; padding: 30px 0; }
        .error-text { text-align: center; color: #ff4d8d; grid-column: span 2; padding: 30px 0; background: #2a0d18; border-radius: 12px; border: 1px solid #ff4d8d; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #12121a; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #1f1f2e; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 10px; text-decoration: none; cursor: pointer; }
        .nav-item.active { color: #ff4d8d; }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="admin-card">
            <img src="https://ui-avatars.com/api/?name=Van+An&background=00d2ff&color=fff" class="admin-avatar" alt="Admin">
            <div class="admin-info">
                <div class="admin-name">Văn An | <span class="badge-admin">Admin</span></div>
                <div class="admin-id">ID: 5772343324 📋</div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <div class="page-title">Dịch vụ</div>
        <div class="page-subtitle">Khám phá kho tài nguyên số.</div>
        
        <!-- Thanh tìm kiếm -->
        <input type="text" id="search-input" class="search-box" placeholder="🔍 Tìm kiếm sản phẩm (VD: Netflix...)">

        <!-- Danh sách sản phẩm -->
        <div id="product-list" class="product-grid">
            <div class="loading-text">Đang tải sản phẩm...</div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">🛍️</span>
            <span>Dịch vụ</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">⏳</span>
            <span>Đang chờ</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">📜</span>
            <span>Lịch sử</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">💳</span>
            <span>Nạp tiền</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Cá nhân</span>
        </div>
    </div>

    <!-- Javascript -->
    <script>
        // Khởi tạo Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Mở rộng toàn màn hình

        // Cấu hình Supabase
        const SUPABASE_URL = 'https://jukdjwdhuvlrwiulhasj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_DcGDl8VrFCDKc9mRxNmlqQ_qVm_Aysl';

        const productList = document.getElementById('product-list');
        const searchInput = document.getElementById('search-input');
        
        // Hàm format tiền tệ
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('vi-VN').format(amount) + ' đ';
        };

        // Hàm lấy sản phẩm
        async function fetchProducts(query = '') {
            productList.innerHTML = '<div class="loading-text">Đang tải sản phẩm...</div>';
            
            try {
                // Gọi API Supabase (giới hạn 50 sản phẩm để web không bị lag)
                let url = `${SUPABASE_URL}/rest/v1/products?select=*&limit=50&order=created_at.desc`;
                
                // Nếu có tìm kiếm thì thêm điều kiện lọc
                if (query) {
                    url += `&name=ilike.%25${encodeURIComponent(query)}%25`;
                }

                const response = await fetch(url, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Lỗi HTTP: ${response.status}`);
                }
                
                const products = await response.json();
                
                if (!products || products.length === 0) {
                    productList.innerHTML = `
                        <div style="grid-column: span 2; text-align: center; padding: 30px; background: #1a1a24; border-radius: 12px;">
                            <div style="font-size: 40px; margin-bottom: 10px;">📦</div>
                            <div style="color: #888;">Không tìm thấy sản phẩm nào.</div>
                        </div>`;
                    return;
                }
                
                // Render sản phẩm
                productList.innerHTML = products.map(p => `
                    <div class="product-card">
                        <div>
                            <img src="${p.image_url || 'https://via.placeholder.com/150'}" class="product-img" onerror="this.src='https://via.placeholder.com/150'">
                            <div class="product-name">${p.name}</div>
                            <div class="product-price">${formatMoney(p.price)}</div>
                            <div class="product-stock">Kho: ${p.stock}</div>
                        </div>
                        <button class="btn-buy" onclick="buyProduct('${p.nexus_id}')">Mua Ngay</button>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error(error);
                productList.innerHTML = `<div class="error-text">Lỗi kết nối: ${error.message}</div>`;
            }
        }

        // Xử lý sự kiện tìm kiếm (Đợi 500ms sau khi ngừng gõ mới tìm)
        let typingTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                fetchProducts(e.target.value.trim());
            }, 500);
        });

        // Hàm xử lý khi bấm mua
        function buyProduct(id) {
            tg.showAlert("Chuẩn bị mở luồng thanh toán cho SP ID: " + id);
        }

        // Chạy lần đầu khi mở App
        document.addEventListener('DOMContentLoaded', () => {
            fetchProducts();
        });
    </script>
</body>
</html>
